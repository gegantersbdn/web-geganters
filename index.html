<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Colla de Geganters de Badalona · Web en construcció</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fb;--fg:#112142;--soft:#4a5878;--accent:#2a56c6;--card:#fff;--line:#d9e0ee}
@media (prefers-color-scheme:dark){:root{--bg:#0b1429;--fg:#eaf0ff;--soft:#a9b6d6;--accent:#8fb0ff;--card:#112142;--line:#22335c}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Instrument Sans",system-ui,sans-serif;display:grid;place-items:center;padding:24px;overflow-x:hidden}
.card{position:relative;max-width:620px;width:100%;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:32px;padding:clamp(32px,6vw,64px) clamp(24px,5vw,56px);box-shadow:0 30px 70px -40px rgba(17,33,66,.5);animation:entra .9s cubic-bezier(.2,.7,.2,1) both}
.logo{width:92px;height:auto;margin:0 auto 22px;display:block}
.logo.fosc{display:none}
@media (prefers-color-scheme:dark){.logo.clar{display:none}.logo.fosc{display:block}}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:"Young Serif",serif;font-weight:400;font-size:clamp(2rem,6vw,3rem);line-height:1.1;margin:14px 0 16px}
p{color:var(--soft);line-height:1.6;margin:0 auto;max-width:44ch;font-size:1.05rem}
.barra{height:6px;border-radius:99px;background:var(--line);margin:30px auto 0;max-width:260px;overflow:hidden}
.barra i{display:block;height:100%;width:42%;border-radius:99px;background:var(--accent);animation:va 2.4s ease-in-out infinite alternate}
.peu{margin-top:26px;font-size:.95rem}
.peu a{color:var(--accent);text-underline-offset:3px}
@keyframes va{from{transform:translateX(-30%)}to{transform:translateX(160%)}}
@keyframes entra{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card,.barra i{animation:none}}
</style>
</head>
<body>
<main class="card">
  <img class="logo clar" src="img/logo-clar.png" alt="" onerror="this.style.display='none'">
  <img class="logo fosc" src="img/logo-fosc.png" alt="" onerror="this.style.display='none'">
  <div class="eyebrow">Colla de Geganters de Badalona</div>
  <h1>Estem preparant la nostra web</h1>
  <p>Aviat hi trobaràs la història de la colla, els gegants, l'Àliga, els capgrossos, l'agenda i molt més.</p>
  <div class="barra" aria-hidden="true"><i></i></div>
  <p class="peu">Torna-hi aviat!</p>
</main>
</body>
</html>
